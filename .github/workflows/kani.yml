name: Kani proofs

# Bounded proofs of the video index decoders and the segment table (`#[cfg(kani)]` harnesses).
# Every harness of a crate runs in one job; each fits in a few GB and takes under two minutes.
on:
  push:
    branches: [kani-proofs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: ${{ matrix.crate }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate: [prism-video, prism-engine]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Prove
        working-directory: crates/${{ matrix.crate }}
        run: |
          free -m
          # Peak memory of the whole run (CBMC included) goes to the log, pass or fail.
          set +e
          /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" \
            timeout 50m cargo kani --lib
          status=$?
          grep -E 'Elapsed|Maximum resident' "$RUNNER_TEMP/time.txt"
          exit "$status"
